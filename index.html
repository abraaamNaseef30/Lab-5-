<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Windowsill – Join the herb club</title>

  <!-- Bootstrap (from earlier labs) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <header class="container py-5">
    <h1>Windowsill</h1>
    <p>A new pot of fresh herbs at your door every month. Join the club to get started.</p>
  </header>

  <main class="container pb-5">
    <div class="row justify-content-center">
      <div class="col-lg-7 col-md-9">

        <!-- Registration form -->
        <section id="formPanel">
          <h2 class="h3 mb-4">Create your account</h2>

          <form id="registerForm" novalidate>
            <div class="row g-3">
              <div class="col-sm-6">
                <label for="firstName" class="form-label">First name</label>
                <input type="text" class="form-control" id="firstName" autocomplete="given-name">
              </div>
              <div class="col-sm-6">
                <label for="lastName" class="form-label">Last name</label>
                <input type="text" class="form-control" id="lastName" autocomplete="family-name">
              </div>
              <div class="col-12">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" autocomplete="email">
              </div>
              <div class="col-12">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" autocomplete="new-password" aria-describedby="pwHelp">
                <div id="pwHelp" class="form-text">Must include at least one special character: ! or ?</div>
              </div>
              <div class="col-12">
                <label for="dob" class="form-label">Date of birth</label>
                <input type="date" class="form-control" id="dob" autocomplete="bday">
              </div>
              <div class="col-12 mt-4">
                <button type="submit" class="btn btn-primary">Join Windowsill</button>
              </div>
            </div>
          </form>
        </section>

        <!-- Result is written here by script.js -->
        <section id="result" class="mt-4" aria-live="polite"></section>

      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
